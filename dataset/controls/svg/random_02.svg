    <text x="760" y="498" font-family="Helvetica, Arial, sans-serif" font-size="10" letter-spacing="4" fill="#f5b942" opacity="0.85">NOW PLAYING</text>
    <text x="760" y="524" font-family="Georgia, 'Times New Roman', serif" font-size="21" font-style="italic" fill="#fff" opacity="0.92">Nocturne in Blue</text>
