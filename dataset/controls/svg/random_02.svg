    <text x="330" y="287" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="2">NOCTURNE</text>
    <text x="330" y="333" text-anchor="middle" font-size="9" font-style="italic" letter-spacing="2.5">records</text>
