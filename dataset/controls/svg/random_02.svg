  <circle cx="330" cy="300" r="78" fill="none" stroke="#8a3f10" stroke-width="1.5" opacity="0.7"/>
  <circle cx="330" cy="300" r="71" fill="none" stroke="#8a3f10" stroke-width="0.8" opacity="0.5"/>
