      <stop offset="0.5" stop-color="#f5b942"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <linearGradient id="staff" gradientUnits="userSpaceOnUse" x1="40" y1="0" x2="770" y2="0">
