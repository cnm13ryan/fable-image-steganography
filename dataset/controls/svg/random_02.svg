      <stop offset="0.12" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="0.88" stop-color="#fff" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%">
