<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 640" width="800" height="640">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1b1844"/>
      <stop offset="0.6" stop-color="#0d0b24"/>
      <stop offset="1" stop-color="#05040c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f5b942" stop-opacity="0.3"/>
      <stop offset="0.55" stop-color="#f5b942" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#f5b942" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="0.5" cy="0.5" r="0.8">
      <stop offset="0.7" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <radialGradient id="disc" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2e2e2e"/>
      <stop offset="0.35" stop-color="#1c1c1c"/>
      <stop offset="0.9" stop-color="#121212"/>
      <stop offset="1" stop-color="#050505"/>
    </radialGradient>
    <radialGradient id="sheen" gradientUnits="userSpaceOnUse" cx="330" cy="300" r="230">
      <stop offset="0.34" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.16"/>
      <stop offset="0.97" stop-color="#ffffff" stop-opacity="0.03"/>
    </radialGradient>
    <radialGradient id="label" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffd977"/>
      <stop offset="0.6" stop-color="#f0a53a"/>
      <stop offset="1" stop-color="#c8681c"/>
