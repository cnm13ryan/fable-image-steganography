  <circle cx="330" cy="300" r="7" fill="#0a0a0a"/>
  <circle cx="330" cy="300" r="3.6" fill="#cfcfcf"/>
  <circle cx="329" cy="299" r="1.4" fill="#fff" opacity="0.8"/>

