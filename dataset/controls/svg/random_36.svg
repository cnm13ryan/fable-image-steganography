<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 700" width="600" height="700">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="72%">
      <stop offset="0" stop-color="#3d4250"/>
      <stop offset="0.6" stop-color="#1f222a"/>
      <stop offset="1" stop-color="#0c0e12"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fdf0b6"/>
      <stop offset="0.3" stop-color="#ddb958"/>
      <stop offset="0.65" stop-color="#b58b25"/>
      <stop offset="1" stop-color="#6c5010"/>
    </linearGradient>
    <linearGradient id="goldRev" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6c5010"/>
      <stop offset="0.35" stop-color="#b58b25"/>
      <stop offset="0.7" stop-color="#e3c467"/>
      <stop offset="1" stop-color="#fff4c4"/>
    </linearGradient>
    <radialGradient id="dial" cx="38%" cy="34%" r="78%">
      <stop offset="0" stop-color="#fffbf1"/>
      <stop offset="0.65" stop-color="#f4ead2"/>
      <stop offset="1" stop-color="#d8caa2"/>
    </radialGradient>
    <linearGradient id="steel" gradientUnits="userSpaceOnUse" x1="293" y1="0" x2="307" y2="0">
      <stop offset="0" stop-color="#6d95d8"/>
      <stop offset="0.45" stop-color="#1f3f80"/>
      <stop offset="1" stop-color="#081432"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff6d5" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff6d5" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#fff6d5" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glare" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="caseShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur3" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <filter id="handShadow" filterUnits="userSpaceOnUse" x="120" y="220" width="360" height="360">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.6" result="blur"/>
      <feOffset in="blur" dx="1.5" dy="2.5" result="off"/>
      <feComponentTransfer in="off" result="shade">
        <feFuncA type="linear" slope="0.45"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="shade"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="dialClip">
      <circle cx="300" cy="400" r="178"/>
    </clipPath>
  </defs>

