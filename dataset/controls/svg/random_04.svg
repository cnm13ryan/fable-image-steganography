<circle cx="250" cy="110" r="3.5"/><circle cx="440" cy="110" r="3.5"/>
<circle cx="250" cy="240" r="3.5"/><circle cx="250" cy="330" r="3.5"/><circle cx="330" cy="330" r="3.5"/>
