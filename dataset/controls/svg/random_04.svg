<text x="392" y="236" text-anchor="end">7</text><text x="408" y="244">DIS</text>
<text x="392" y="326" text-anchor="end">6</text><text x="408" y="334">THR</text>
<text x="392" y="376" text-anchor="end">2</text><text x="408" y="384">TRIG</text>
<text x="568" y="314">3</text><text x="552" y="304" text-anchor="end">OUT</text>
<text x="446" y="194">8</text><text x="440" y="216" text-anchor="middle">VCC</text>
<text x="526" y="194">4</text><text x="520" y="216" text-anchor="middle">RST</text>
<text x="446" y="416">1</text><text x="440" y="392" text-anchor="middle">GND</text>
<text x="526" y="416">5</text><text x="520" y="392" text-anchor="middle">CTRL</text>
</g>

