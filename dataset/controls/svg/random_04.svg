<path d="M660 75H720V105H760V75H820V105H860" stroke="#ffd166" stroke-width="2" fill="none" stroke-linejoin="round"/>
<path d="M660 190Q680 153 720 150Q735 190 760 190Q780 153 820 150Q835 190 860 190" stroke="#7fdcff" stroke-width="2" fill="none"/>
