<text x="30" y="50" class="t b" style="font-size:20px">FIG. 1 · NE555 ASTABLE MULTIVIBRATOR</text>
<text x="30" y="72" class="t" opacity=".85">Schematic · free-running oscillator driving an LED at ≈ 1 Hz</text>

