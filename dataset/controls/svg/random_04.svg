<g class="t s">
<text x="608" y="93" class="a">OUT</text>
<text x="608" y="173" class="c">Vc</text>
<text x="656" y="153" text-anchor="end">2/3 Vcc</text>
<text x="656" y="193" text-anchor="end">1/3 Vcc</text>
<text x="690" y="233" text-anchor="middle">tH</text>
<text x="740" y="233" text-anchor="middle">tL</text>
<text x="862" y="233" text-anchor="end">T = tH + tL ≈ 1.0 s</text>
</g>

<!-- notes -->
<g class="t" style="font-size:10.5px">
<text x="30" y="540" class="b">NOTES</text>
<text x="30" y="558">1. f = 1.44 / ((R1 + 2·R2)·C1) = 1.44 / (146 kΩ · 10 µF) ≈ 0.99 Hz</text>
<text x="30" y="574">2. tH = 0.693·(R1 + R2)·C1 ≈ 0.54 s;  tL = 0.693·R2·C1 ≈ 0.47 s</text>
<text x="30" y="590">3. Duty cycle D = (R1 + R2) / (R1 + 2·R2) = 78 / 146 ≈ 53 %</text>
<text x="30" y="606">4. C2 decouples CTRL (pin 5); R3 limits LED current to ≈ 11 mA at 9 V.</text>
<text x="30" y="622">5. OUT sources or sinks up to 200 mA; keep RST (pin 4) tied to VCC.</text>
</g>

