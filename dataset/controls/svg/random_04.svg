<text x="585" y="290" class="t s a" text-anchor="middle">OUT</text>
<text x="262" y="324" class="t s c">Vc</text>

<!-- timing inset -->
<rect x="600" y="40" width="270" height="210" fill="rgba(0,0,0,.28)" stroke="#e6f0ff" stroke-width="1.2"/>
<text x="612" y="58" class="t s b" letter-spacing="1.2">TIMING DIAGRAM</text>
<path d="M660 150H862 M660 190H862" stroke="#e6f0ff" stroke-width="1" fill="none" stroke-dasharray="4 4" opacity=".45"/>
