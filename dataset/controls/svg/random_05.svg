  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050818"/>
      <stop offset="0.35" stop-color="#141842"/>
      <stop offset="0.62" stop-color="#3a2158"/>
      <stop offset="0.8" stop-color="#7b3451"/>
      <stop offset="0.93" stop-color="#c4603b"/>
      <stop offset="1" stop-color="#f2a35a"/>
    </linearGradient>
    <radialGradient id="hglow">
      <stop offset="0" stop-color="#ffb070" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#ff8a4a" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#ff8a4a" stop-opacity="0"/>
