    <circle cx="160" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="210" cy="70" r="0.9" opacity="0.6"/>
    <circle cx="260" cy="25" r="1.3" opacity="0.85"/>
    <circle cx="300" cy="60" r="1" opacity="0.7"/>
    <circle cx="340" cy="18" r="1.1" opacity="0.75"/>
    <circle cx="390" cy="45" r="1.4" opacity="0.9"/>
    <circle cx="430" cy="90" r="0.9" opacity="0.55"/>
    <circle cx="470" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="520" cy="65" r="1" opacity="0.7"/>
    <circle cx="560" cy="20" r="1.3" opacity="0.85"/>
    <circle cx="600" cy="50" r="0.9" opacity="0.6"/>
    <circle cx="650" cy="28" r="1.2" opacity="0.8"/>
    <circle cx="700" cy="75" r="1" opacity="0.7"/>
    <circle cx="740" cy="35" r="1.4" opacity="0.9"/>
    <circle cx="775" cy="95" r="1" opacity="0.65"/>
    <circle cx="30" cy="120" r="0.9" opacity="0.5"/>
    <circle cx="190" cy="110" r="1" opacity="0.6"/>
    <circle cx="240" cy="145" r="0.8" opacity="0.5"/>
    <circle cx="500" cy="120" r="0.9" opacity="0.55"/>
    <circle cx="590" cy="105" r="1.1" opacity="0.65"/>
    <circle cx="720" cy="135" r="0.9" opacity="0.5"/>
    <circle cx="120" cy="160" r="0.8" opacity="0.45"/>
    <circle cx="450" cy="160" r="0.8" opacity="0.45"/>
    <circle cx="770" cy="170" r="0.9" opacity="0.5"/>
    <circle cx="60" cy="200" r="0.8" opacity="0.4"/>
    <circle cx="330" cy="200" r="0.8" opacity="0.4"/>
  </g>
  <path d="M 390 39 V 51 M 384 45 H 396" stroke="#ffffff" stroke-width="0.8" opacity="0.6"/>

  <!-- Moon -->
  <circle cx="110" cy="80" r="42" fill="url(#moonGlow)"/>
  <path d="M 110 58 A 22 22 0 0 0 110 102 A 26 26 0 0 1 110 58 Z" fill="#f6f1d5"/>

  <!-- Clouds -->
  <ellipse cx="300" cy="240" rx="60" ry="4" fill="#55608f" opacity="0.5"/>
  <ellipse cx="560" cy="265" rx="45" ry="4" fill="#4a4573" opacity="0.6"/>
  <ellipse cx="150" cy="296" rx="95" ry="6" fill="#6b4a72" opacity="0.8"/>
  <ellipse cx="480" cy="300" rx="60" ry="5" fill="#5e4a78" opacity="0.6"/>
  <ellipse cx="70" cy="318" rx="70" ry="5" fill="#84506a" opacity="0.7"/>
  <ellipse cx="360" cy="318" rx="130" ry="6" fill="#7c4e68" opacity="0.75"/>
  <ellipse cx="250" cy="337" rx="80" ry="4" fill="#9a5a63" opacity="0.6"/>

