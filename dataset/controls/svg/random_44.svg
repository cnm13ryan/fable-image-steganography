  <path d="M 544 396 L 575 380 L 640 372 L 700 374 L 770 380 L 800 396 L 800 414 L 770 398 L 700 391 L 640 389 L 578 397 L 554 411 Z" fill="#3a5a3a"/>
  <path d="M 544 396 L 575 380 L 640 372 L 700 374 L 770 380 L 800 396" fill="none" stroke="#6b9a52" stroke-width="1.5" opacity="0.45"/>

  <!-- Rocks at the foot of the cliff -->
