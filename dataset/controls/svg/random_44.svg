    <path d="M -10 510 q 45 -9 90 0 t 90 0 t 90 0 t 90 0 t 90 0" stroke-width="1.8" opacity="0.28"/>
    <path d="M -10 555 q 50 -10 100 0 t 100 0 t 100 0 t 100 0" stroke-width="2" opacity="0.3"/>
    <path d="M 40 452 q 20 -4 40 0" stroke-width="1.3" opacity="0.25"/>
    <path d="M 300 455 q 25 -5 50 0" stroke-width="1.3" opacity="0.25"/>
    <path d="M 180 490 q 25 -5 50 0" stroke-width="1.5" opacity="0.25"/>
    <path d="M 350 530 q 30 -6 60 0" stroke-width="1.6" opacity="0.28"/>
    <path d="M 240 585 q 30 -6 60 0" stroke-width="2" opacity="0.3"/>
  </g>

  <!-- Sailboat on the horizon -->
  <g fill="#141c33">
    <path d="M 250 356 L 284 356 L 279 363 L 255 363 Z"/>
    <rect x="265.5" y="334" width="1.5" height="22"/>
    <path d="M 268 336 L 268 355 L 281 355 Z"/>
    <path d="M 264 340 L 264 355 L 253 355 Z"/>
  </g>

  <!-- Light beams -->
  <path d="M 646 130 L -100 110 L -100 392 L 646 156 Z" fill="url(#beamL)"/>
  <path d="M 646 138 L -100 180 L -100 300 L 646 148 Z" fill="url(#beamL)" opacity="0.5"/>
  <path d="M 674 130 L 900 98 L 900 186 L 674 156 Z" fill="url(#beamR)"/>

  <!-- Headland -->
  <path d="M 462 600 L 468 560 L 470 525 Q 488 472 518 432 L 544 396 L 575 380 L 640 372 L 700 374 L 770 380 L 800 396 L 800 600 Z" fill="#262a36"/>
  <path d="M 544 396 L 575 380 L 600 388 L 572 420 L 540 450 L 522 445 Z" fill="#31364a"/>
  <path d="M 500 600 L 498 545 L 515 500 L 545 470 L 560 480 L 540 530 L 530 600 Z" fill="#2e323e"/>
  <path d="M 640 600 L 645 520 L 665 470 L 700 455 L 695 520 L 680 600 Z" fill="#2b2f3b"/>
