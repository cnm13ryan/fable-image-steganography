<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <title>Lighthouse on a headland at dusk</title>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="360">
      <stop offset="0" stop-color="#090f2b"/>
      <stop offset="0.35" stop-color="#16305c"/>
      <stop offset="0.62" stop-color="#3d4f85"/>
      <stop offset="0.8" stop-color="#7a567f"/>
      <stop offset="0.92" stop-color="#c77657"/>
      <stop offset="1" stop-color="#f2a564"/>
    </linearGradient>
    <linearGradient id="sea" gradientUnits="userSpaceOnUse" x1="0" y1="360" x2="0" y2="600">
      <stop offset="0" stop-color="#d88b5c"/>
      <stop offset="0.06" stop-color="#5f7ca3"/>
      <stop offset="0.3" stop-color="#2a4d7a"/>
      <stop offset="1" stop-color="#0d2140"/>
    </linearGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#f6f1d5" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#f6f1d5" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="beamL" gradientUnits="userSpaceOnUse" x1="646" y1="0" x2="-100" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ffe9a8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="beamR" gradientUnits="userSpaceOnUse" x1="674" y1="0" x2="900" y2="0">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="towerGrad" gradientUnits="userSpaceOnUse" x1="632" y1="0" x2="688" y2="0">
      <stop offset="0" stop-color="#eeece6"/>
      <stop offset="0.3" stop-color="#ffffff"/>
      <stop offset="0.7" stop-color="#d3d5da"/>
      <stop offset="1" stop-color="#9a9eaa"/>
    </linearGradient>
    <linearGradient id="bandGrad" gradientUnits="userSpaceOnUse" x1="632" y1="0" x2="688" y2="0">
      <stop offset="0" stop-color="#d4424a"/>
      <stop offset="0.3" stop-color="#e65a5e"/>
      <stop offset="0.7" stop-color="#b42e35"/>
      <stop offset="1" stop-color="#7c1f25"/>
    </linearGradient>
    <radialGradient id="lanternGlow" gradientUnits="userSpaceOnUse" cx="660" cy="142" r="26">
      <stop offset="0" stop-color="#fffdf0"/>
      <stop offset="0.35" stop-color="#ffe08a"/>
      <stop offset="1" stop-color="#ef9f3e"/>
    </radialGradient>
    <radialGradient id="bloom">
      <stop offset="0" stop-color="#fff4c8" stop-opacity="0.9"/>
      <stop offset="0.25" stop-color="#ffe29a" stop-opacity="0.45"/>
      <stop offset="0.6" stop-color="#ffcf70" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffcf70" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="towerClip">
      <polygon points="632,370 688,370 678,170 642,170"/>
    </clipPath>
  </defs>

