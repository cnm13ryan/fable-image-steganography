    <line x1="230" y1="372" x2="330" y2="372" opacity="0.45"/>
    <line x1="60" y1="376" x2="110" y2="376" opacity="0.4"/>
    <line x1="350" y1="378" x2="420" y2="378" opacity="0.35"/>
    <line x1="180" y1="383" x2="260" y2="383" opacity="0.3"/>
  </g>

  <!-- Waves -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M -10 392 q 25 -5 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0 t 50 0" stroke-width="1" opacity="0.18"/>
    <path d="M -10 412 q 30 -6 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 60 0" stroke-width="1.2" opacity="0.2"/>
