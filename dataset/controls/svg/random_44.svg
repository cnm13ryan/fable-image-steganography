  <path d="M 0 361 L 0 338 Q 30 324 70 330 Q 110 334 140 346 Q 165 354 185 361 Z" fill="#4c4164"/>

  <!-- Afterglow on the water -->
  <g stroke="#f6b57c" stroke-linecap="round" fill="none" stroke-width="1.5">
