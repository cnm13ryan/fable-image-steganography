    <path d="M 418 572 q 15 -5 30 0 q 10 -3 20 1" opacity="0.35"/>
    <path d="M 445 596 q 15 -5 30 0" opacity="0.3"/>
  </g>

  <!-- Keeper's cottage -->
  <g>
    <rect x="708" y="356" width="40" height="28" fill="#d8d2c3"/>
    <rect x="741" y="356" width="7" height="28" fill="#b5ae9f"/>
    <rect x="740" y="338" width="6" height="14" fill="#5a3b36"/>
    <path d="M 702 357 L 728 336 L 754 357 Z" fill="#7a2c30"/>
    <rect x="714" y="368" width="8" height="16" fill="#4a3a35"/>
    <rect x="729" y="364" width="10" height="9" fill="#ffd27a"/>
    <path d="M 734 364 V 373 M 729 368.5 H 739" stroke="#4a3a35" stroke-width="1"/>
    <circle cx="734" cy="368" r="14" fill="url(#bloom)" opacity="0.6"/>
    <path d="M 743 337 q 5 -8 0 -15 q -5 -7 1 -14" fill="none" stroke="#c9c3b3" stroke-width="1.8" stroke-linecap="round" opacity="0.35"/>
  </g>

  <!-- Lighthouse -->
  <path d="M 620 382 L 700 382 L 697 370 L 623 370 Z" fill="#8f929c"/>
  <polygon points="632,370 688,370 678,170 642,170" fill="url(#towerGrad)"/>
  <rect x="620" y="210" width="80" height="40" fill="url(#bandGrad)" clip-path="url(#towerClip)"/>
  <rect x="620" y="290" width="80" height="40" fill="url(#bandGrad)" clip-path="url(#towerClip)"/>
  <rect x="655" y="182" width="10" height="16" rx="5" fill="#2a3550" stroke="#4a4f5c" stroke-width="1"/>
  <rect x="655" y="262" width="10" height="16" rx="5" fill="#f2c266" stroke="#4a4f5c" stroke-width="1"/>
  <path d="M 651 370 L 651 350 A 9 9 0 0 1 669 350 L 669 370 Z" fill="#3b2b27" stroke="#6b5a50" stroke-width="1"/>
  <path d="M 634 171 L 642 178 L 678 178 L 686 171 Z" fill="#353946"/>
  <rect x="630" y="164" width="60" height="7" rx="1" fill="#2d3140"/>
  <rect x="646" y="121" width="28" height="43" fill="url(#lanternGlow)"/>
  <circle cx="660" cy="142" r="7" fill="#fffbe6"/>
  <path d="M 655.3 121 V 164 M 664.6 121 V 164 M 646 142.5 H 674" stroke="#2a2d35" stroke-width="1.5"/>
  <rect x="645" y="120" width="30" height="45" fill="none" stroke="#2a2d35" stroke-width="2"/>
  <g stroke="#2d3140" stroke-linecap="round">
    <line x1="631" y1="148" x2="689" y2="148" stroke-width="1.8"/>
    <line x1="631" y1="156" x2="689" y2="156" stroke-width="1"/>
    <path d="M 632 148 V 164 M 641.5 148 V 164 M 651 148 V 164 M 660.5 148 V 164 M 670 148 V 164 M 679.5 148 V 164 M 689 148 V 164" stroke-width="1.4"/>
  </g>
  <rect x="640" y="117" width="40" height="4" rx="1" fill="#2a2d35"/>
  <path d="M 642 117 A 18 18 0 0 1 678 117 Z" fill="#7a2c30"/>
  <path d="M 646.8 112.2 A 14 14 0 0 1 657.6 103.2" fill="none" stroke="#b55a5e" stroke-width="1.5" opacity="0.7"/>
  <circle cx="660" cy="96" r="3.5" fill="#2a2d35"/>
  <line x1="660" y1="93" x2="660" y2="80" stroke="#2a2d35" stroke-width="1.5"/>
  <circle cx="660" cy="142" r="70" fill="url(#bloom)"/>

  <!-- Gulls -->
  <g fill="none" stroke="#141a2c" stroke-width="1.5" stroke-linecap="round">
    <path d="M 405 282 q 6 -6 12 0 q 6 -6 12 0"/>
    <path d="M 432 270 q 5 -5 10 0 q 5 -5 10 0"/>
    <path d="M 452 288 q 5 -5 10 0 q 5 -5 10 0"/>
  </g>

  <!-- Foreground rocks -->
  <path d="M 0 600 L 0 548 Q 20 530 48 540 Q 70 528 95 545 Q 125 540 150 562 Q 180 558 205 580 L 215 600 Z" fill="#14171f"/>
  <path d="M 0 548 Q 20 530 48 540 Q 70 528 95 545 Q 125 540 150 562" fill="none" stroke="#4b5068" stroke-width="1.2" opacity="0.5"/>
  <g fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M 158 556 q 14 -4 28 0" stroke-width="1.5" opacity="0.3"/>
    <path d="M 222 590 q 15 -5 30 0" stroke-width="1.8" opacity="0.35"/>
    <path d="M 212 592 q 18 -6 36 0 q 14 -4 28 2" stroke-width="1.6" opacity="0.25"/>
  </g>
</svg>