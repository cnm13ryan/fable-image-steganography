<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 540" width="760" height="540">
  <title>Fibonacci squares and golden spiral</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101827"/>
      <stop offset="1" stop-color="#1b2540"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#f4a261"/>
    </linearGradient>
  </defs>
  <rect width="760" height="540" fill="url(#bg)"/>
  <g stroke="#9fb3c8" stroke-width="1.2" fill-opacity="0.9">
    <rect x="40" y="40" width="420" height="420" fill="#233554"/>
    <rect x="460" y="40" width="260" height="260" fill="#2b3f66"/>
    <rect x="560" y="300" width="160" height="160" fill="#334a78"/>
    <rect x="460" y="360" width="100" height="100" fill="#3b5589"/>
    <rect x="460" y="300" width="60" height="60" fill="#44609a"/>
    <rect x="520" y="300" width="40" height="40" fill="#4d6bab"/>
    <rect x="520" y="340" width="20" height="20" fill="#5876bb"/>
    <rect x="540" y="340" width="20" height="20" fill="#6382cc"/>
  </g>
  <g stroke="#9fb3c8" stroke-width="1" stroke-dasharray="4 4" opacity="0.6">
    <line x1="40" y1="40" x2="720" y2="460"/>
    <line x1="720" y1="40" x2="460" y2="460"/>
  </g>
  <path d="M520 340 A20 20 0 0 0 540 360 A20 20 0 0 0 560 340 A40 40 0 0 0 520 300 A60 60 0 0 0 460 360 A100 100 0 0 0 560 460 A160 160 0 0 0 720 300 A260 260 0 0 0 460 40 A420 420 0 0 0 40 460" fill="none" stroke="url(#gold)" stroke-width="3" stroke-linecap="round"/>
  <circle cx="531.9" cy="343.8" r="3" fill="#ffd166"/>
  <g font-family="Georgia, 'Times New Roman', serif" fill="#dbe4f0" text-anchor="middle" dominant-baseline="central" opacity="0.85">
    <text x="250" y="250" font-size="72">21</text>
    <text x="590" y="170" font-size="48">13</text>
    <text x="640" y="380" font-size="32">8</text>
    <text x="510" y="410" font-size="22">5</text>
    <text x="490" y="330" font-size="15">3</text>
    <text x="540" y="320" font-size="11">2</text>
    <text x="530" y="351" font-size="7">1</text>
    <text x="550" y="351" font-size="7">1</text>
  </g>
  <text x="380" y="508" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#dbe4f0" text-anchor="middle">F<tspan dy="6" font-size="12">n+1</tspan><tspan dy="-6"> / F</tspan><tspan dy="6" font-size="12">n</tspan><tspan dy="-6"> → φ = (1 + √5) / 2 ≈ 1.6180339887…</tspan></text>
</svg>