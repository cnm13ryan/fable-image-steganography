<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1733"/>
      <stop offset="0.2" stop-color="#2f2f5e"/>
      <stop offset="0.36" stop-color="#6b4470"/>
      <stop offset="0.5" stop-color="#c0665f"/>
      <stop offset="0.62" stop-color="#eaa36c"/>
      <stop offset="0.8" stop-color="#f3c27e"/>
    </linearGradient>
    <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34304a"/>
      <stop offset="1" stop-color="#1a1826"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#ffe9a6" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffe9a6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="wglow">
      <stop offset="0" stop-color="#ffd466" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#ffd466" stop-opacity="0"/>
    </radialGradient>

    <!-- lit window -->
    <g id="wl">
      <rect x="-14" y="-14" width="54" height="62" fill="url(#wglow)"/>
      <rect x="-3" y="-3" width="32" height="40" fill="#f3ead4"/>
      <rect x="0" y="0" width="26" height="34" fill="#ffd466"/>
      <rect x="12" y="0" width="2" height="34" fill="#f3ead4"/>
      <rect x="0" y="16" width="26" height="2" fill="#f3ead4"/>
      <rect x="-5" y="34" width="36" height="3" fill="#f3ead4"/>
    </g>
    <!-- dark window -->
    <g id="wd">
      <rect x="-3" y="-3" width="32" height="40" fill="#f3ead4"/>
      <rect x="0" y="0" width="26" height="34" fill="#2a2d4d"/>
      <rect x="2" y="2" width="7" height="13" fill="#3b4169"/>
      <rect x="12" y="0" width="2" height="34" fill="#f3ead4"/>
      <rect x="0" y="16" width="26" height="2" fill="#f3ead4"/>
      <rect x="-5" y="34" width="36" height="3" fill="#f3ead4"/>
    </g>
    <!-- door (panel colour inherited from use) -->
    <g id="door">
      <rect x="-6" y="62" width="40" height="5" fill="#6b6577"/>
      <rect x="-3" y="-15" width="34" height="77" fill="#f3ead4"/>
      <rect x="0" y="-12" width="28" height="9" fill="#ffd466"/>
      <rect x="0" y="0" width="28" height="62"/>
      <rect x="4" y="5" width="20" height="20" fill="none" stroke="#f3ead4" stroke-opacity="0.45" stroke-width="1.5"/>
      <rect x="4" y="31" width="20" height="26" fill="none" stroke="#f3ead4" stroke-opacity="0.45" stroke-width="1.5"/>
      <circle cx="23" cy="34" r="1.8" fill="#f3ead4"/>
    </g>
    <!-- flower box -->
    <g id="fbox">
      <ellipse cx="13" cy="3" rx="15" ry="3" fill="#4f7d4a"/>
      <circle cx="3" cy="2" r="2.6" fill="#e7627a"/>
      <circle cx="9" cy="0" r="2.6" fill="#f2b84b"/>
      <circle cx="15" cy="2" r="2.6" fill="#e7627a"/>
      <circle cx="21" cy="0" r="2.6" fill="#f2b84b"/>
      <rect x="-2" y="3" width="30" height="7" rx="1" fill="#5c3d33"/>
    </g>
    <!-- potted plant -->
    <g id="plant">
      <circle cx="0" cy="-7" r="7" fill="#3e6b4a"/>
      <circle cx="-3" cy="-9" r="3" fill="#4f8a5c"/>
      <polygon points="-6,0 6,0 5,8 -5,8" fill="#a0523d"/>
    </g>
    <!-- cat -->
    <g id="cat" fill="#2b2235">
      <ellipse cx="0" cy="12" rx="8" ry="6"/>
      <circle cx="0" cy="2" r="5"/>
      <polygon points="-4.5,-1 -5.5,-7 -1,-2.5"/>
      <polygon points="4.5,-1 5.5,-7 1,-2.5"/>
      <path d="M7 14q6 -1 5 -9" fill="none" stroke="#2b2235" stroke-width="2" stroke-linecap="round"/>
    </g>
    <!-- street lamp -->
    <g id="lamp">
      <circle cx="0" cy="-88" r="46" fill="url(#glow)"/>
      <rect x="-7" y="-8" width="14" height="8" fill="#1f1d2a"/>
      <rect x="-2" y="-84" width="4" height="78" fill="#1f1d2a"/>
      <polygon points="-10,-96 0,-106 10,-96" fill="#1f1d2a"/>
      <rect x="-8" y="-96" width="16" height="14" fill="#1f1d2a"/>
      <rect x="-5" y="-94" width="10" height="11" fill="#ffe08a"/>
    </g>
  </defs>

  <!-- sky -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- stars -->
