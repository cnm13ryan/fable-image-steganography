    <rect x="140" y="205" width="110" height="175" fill="#e5bd6c"/>
    <rect x="136" y="197" width="118" height="10" fill="#4a3b3b"/>
    <rect x="175" y="187" width="40" height="12" fill="#4a3b3b"/>
    <circle cx="195" cy="193" r="3" fill="#e5bd6c"/>
    <use xlink:href="#wd" x="157" y="225"/>
    <use xlink:href="#wl" x="207" y="225"/>
    <use xlink:href="#door" x="156" y="318" fill="#6b3a3a"/>
    <use xlink:href="#wl" x="207" y="306"/>
    <polygon points="201,298 239,298 243,311 197,311" fill="#b4473f"/>
    <path d="M204.5 298v13M211.5 298v13M218.5 298v13M225.5 298v13M232.5 298v13" stroke="#f3ead4" stroke-width="3" stroke-opacity="0.85"/>
