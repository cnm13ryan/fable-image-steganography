    <use xlink:href="#wd" x="85" y="210"/>
    <use xlink:href="#fbox" x="29" y="244"/>
    <use xlink:href="#fbox" x="85" y="244"/>
    <use xlink:href="#door" x="28" y="318" fill="#2f3e5c"/>
    <use xlink:href="#wl" x="85" y="306"/>
    <use xlink:href="#plant" x="70" y="372"/>
  </g>

