  <g>
    <rect x="250" y="160" width="130" height="220" fill="#5f8796"/>
    <rect x="265" y="110" width="14" height="42" fill="#3b3b4a"/>
    <rect x="263" y="107" width="18" height="5" fill="#2b2b38"/>
    <polygon points="242,164 315,80 388,164" fill="#2f3a4a"/>
    <path d="M293 105H337M276 125H354M258 145H372" stroke="#000" stroke-opacity="0.15" stroke-width="1.5"/>
    <path d="M242 164L315 80L388 164" fill="none" stroke="#f3ead4" stroke-width="3" stroke-linejoin="round"/>
    <circle cx="315" cy="128" r="10" fill="#f3ead4"/>
    <circle cx="315" cy="128" r="7.5" fill="#ffd466"/>
    <path d="M315 120.5V135.5M307.5 128H322.5" stroke="#f3ead4" stroke-width="1.5"/>
    <use xlink:href="#wl" x="277" y="178"/>
    <use xlink:href="#wl" x="327" y="178"/>
    <use xlink:href="#wd" x="277" y="240"/>
    <use xlink:href="#wl" x="327" y="240"/>
    <use xlink:href="#door" x="276" y="318" fill="#e0a458"/>
    <use xlink:href="#wl" x="327" y="306"/>
    <use xlink:href="#cat" x="340" y="322"/>
    <use xlink:href="#plant" x="264" y="372"/>
    <use xlink:href="#plant" x="316" y="372"/>
  </g>

  <!-- house 4: dusty pink mansard with dormer -->
  <g>
    <rect x="380" y="215" width="100" height="165" fill="#d8a39b"/>
    <polygon points="374,219 390,183 470,183 486,219" fill="#4a3340"/>
    <rect x="374" y="216" width="112" height="4" fill="#f3ead4"/>
    <rect x="418" y="190" width="24" height="26" fill="#f3ead4"/>
    <rect x="421" y="193" width="18" height="21" fill="#ffd466"/>
    <path d="M430 193V214M421 203H439" stroke="#f3ead4" stroke-width="1.5"/>
    <polygon points="414,191 430,180 446,191" fill="#2f2230"/>
    <use xlink:href="#wd" x="392" y="238"/>
    <use xlink:href="#wl" x="442" y="238"/>
    <use xlink:href="#fbox" x="392" y="272"/>
    <use xlink:href="#fbox" x="442" y="272"/>
    <use xlink:href="#door" x="391" y="318" fill="#3f5f4a"/>
    <use xlink:href="#wl" x="442" y="306"/>
  </g>

  <!-- house 5: sage gable with attic window -->
  <g>
    <rect x="480" y="175" width="140" height="205" fill="#8aa07a"/>
    <rect x="590" y="120" width="14" height="42" fill="#5a4a3f"/>
    <rect x="588" y="117" width="18" height="5" fill="#3d3229"/>
    <polygon points="472,179 550,105 628,179" fill="#3a3a2f"/>
    <path d="M524 130H576M503 150H597M484 168H616" stroke="#000" stroke-opacity="0.15" stroke-width="1.5"/>
    <path d="M472 179L550 105L628 179" fill="none" stroke="#f3ead4" stroke-width="3" stroke-linejoin="round"/>
    <rect x="538" y="132" width="24" height="28" fill="#f3ead4"/>
    <rect x="541" y="135" width="18" height="22" fill="#2a2d4d"/>
    <path d="M550 135V157M541 146H559" stroke="#f3ead4" stroke-width="1.5"/>
    <use xlink:href="#wl" x="497" y="193"/>
    <use xlink:href="#wd" x="537" y="193"/>
    <use xlink:href="#wl" x="577" y="193"/>
    <use xlink:href="#wd" x="497" y="250"/>
    <use xlink:href="#wl" x="537" y="250"/>
    <use xlink:href="#wl" x="577" y="250"/>
    <use xlink:href="#wl" x="497" y="306"/>
    <use xlink:href="#door" x="536" y="318" fill="#6b4a7a"/>
    <use xlink:href="#wl" x="577" y="306"/>
  </g>

  <!-- house 6: mauve flat roof with cornice -->
  <g>
    <rect x="620" y="195" width="180" height="185" fill="#9c6b7e"/>
    <rect x="650" y="160" width="18" height="22" fill="#5a3f4c"/>
    <rect x="648" y="157" width="22" height="5" fill="#3b2a36"/>
    <rect x="752" y="160" width="18" height="22" fill="#5a3f4c"/>
    <rect x="750" y="157" width="22" height="5" fill="#3b2a36"/>
    <path d="M786 179V148M778 152H794M780 160H792" stroke="#2b2235" stroke-width="1.5"/>
    <rect x="620" y="179" width="180" height="12" fill="#4d3744"/>
    <rect x="614" y="189" width="192" height="10" fill="#f3ead4"/>
    <line x1="622" y1="201" x2="800" y2="201" stroke="#f3ead4" stroke-width="4" stroke-dasharray="6 8"/>
    <rect x="620" y="282" width="180" height="4" fill="#f3ead4" opacity="0.8"/>
    <use xlink:href="#wl" x="642" y="222"/>
    <use xlink:href="#wl" x="697" y="222"/>
    <use xlink:href="#wd" x="752" y="222"/>
    <use xlink:href="#wd" x="642" y="306"/>
    <use xlink:href="#door" x="696" y="318" fill="#2a2a35"/>
    <use xlink:href="#wl" x="752" y="306"/>
    <use xlink:href="#plant" x="684" y="372"/>
    <use xlink:href="#plant" x="736" y="372"/>
  </g>

  <!-- street furniture -->
  <use xlink:href="#lamp" x="140" y="380"/>
  <use xlink:href="#lamp" x="478" y="380"/>
  <use xlink:href="#cat" x="500" y="362"/>

  <!-- bicycle leaning by house 2 -->
  <g fill="none" stroke="#1f1d2a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="204" cy="370" r="9.5"/>
    <circle cx="236" cy="370" r="9.5"/>
    <path d="M204 370L214 353L228 354L236 370M214 353L221 371L204 370M221 371L228 354"/>
    <path d="M209 352L217 352" stroke-width="3"/>
    <path d="M226 354L233 349" stroke-width="2.5"/>
  </g>

  <!-- parked car -->
  <ellipse cx="340" cy="457" rx="62" ry="4" fill="#000" opacity="0.3"/>
  <g>
    <rect x="280" y="424" width="120" height="24" rx="7" fill="#3f8a8a"/>
    <path d="M300 426L313 409L367 409L383 426Z" fill="#3f8a8a"/>
    <path d="M305 424L316 412L339 412L339 424ZM345 424L345 412L364 412L375 424Z" fill="#8fa5c4"/>
    <path d="M342 412V446" stroke="#2f6a6a" stroke-width="1.5"/>
    <rect x="280" y="432" width="5" height="6" rx="1" fill="#ffe8a0"/>
    <rect x="395" y="432" width="5" height="6" rx="1" fill="#ff6b6b"/>
    <circle cx="305" cy="448" r="9" fill="#1a1a22"/>
    <circle cx="305" cy="448" r="3.5" fill="#8a8a94"/>
    <circle cx="375" cy="448" r="9" fill="#1a1a22"/>
    <circle cx="375" cy="448" r="3.5" fill="#8a8a94"/>
