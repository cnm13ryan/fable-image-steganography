  <rect x="0" y="380" width="800" height="18" fill="#8d879b"/>
  <path d="M40 380v18M80 380v18M120 380v18M160 380v18M200 380v18M240 380v18M280 380v18M320 380v18M360 380v18M400 380v18M440 380v18M480 380v18M520 380v18M560 380v18M600 380v18M640 380v18M680 380v18M720 380v18M760 380v18" stroke="#7a748c" stroke-width="1.2"/>
  <rect x="0" y="398" width="800" height="5" fill="#5a546e"/>
  <rect x="0" y="403" width="800" height="97" fill="url(#road)"/>
  <line x1="0" y1="474" x2="800" y2="474" stroke="#d9c27a" stroke-width="3" stroke-dasharray="26 20" opacity="0.6"/>
  <ellipse cx="140" cy="406" rx="60" ry="12" fill="#ffe08a" opacity="0.12"/>
  <ellipse cx="478" cy="406" rx="60" ry="12" fill="#ffe08a" opacity="0.12"/>
  <ellipse cx="600" cy="462" rx="15" ry="5" fill="#26233a" stroke="#4a4660" stroke-width="1.5"/>

  <!-- house 1: terracotta gable -->
  <g>
