    <circle cx="75" cy="22" r="0.9"/>
    <circle cx="120" cy="60" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite"/></circle>
    <circle cx="160" cy="30" r="1"/>
    <circle cx="210" cy="70" r="0.8"/>
    <circle cx="240" cy="95" r="0.9"/>
    <circle cx="250" cy="25" r="1.3"/>
    <circle cx="300" cy="55" r="1"/>
    <circle cx="345" cy="18" r="1.6"><animate attributeName="opacity" values="1;0.3;1" dur="4.2s" repeatCount="indefinite"/></circle>
    <circle cx="365" cy="118" r="0.8"/>
    <circle cx="390" cy="45" r="0.9"/>
    <circle cx="430" cy="80" r="1.2"/>
    <circle cx="470" cy="30" r="1"/>
    <circle cx="505" cy="95" r="0.7"/>
    <circle cx="515" cy="60" r="1.4"><animate attributeName="opacity" values="1;0.25;1" dur="3.6s" repeatCount="indefinite"/></circle>
    <circle cx="555" cy="20" r="0.9"/>
    <circle cx="600" cy="50" r="1.1"/>
    <circle cx="640" cy="25" r="1.3"/>
    <circle cx="700" cy="20" r="0.8"/>
    <circle cx="745" cy="35" r="1"/>
    <circle cx="775" cy="80" r="1.5"/>
    <circle cx="60" cy="100" r="0.9"/>
    <circle cx="20" cy="110" r="1"/>
    <circle cx="190" cy="118" r="1.1"/>
    <circle cx="330" cy="100" r="0.8"/>
    <circle cx="455" cy="120" r="1"/>
    <circle cx="590" cy="100" r="1.2"/>
    <circle cx="770" cy="130" r="0.9"/>
  </g>

  <!-- moon -->
  <circle cx="690" cy="75" r="64" fill="url(#glow)" opacity="0.4"/>
  <circle cx="690" cy="75" r="26" fill="#f7f2dc"/>
  <circle cx="681" cy="67" r="4" fill="#e6dfc0"/>
  <circle cx="698" cy="86" r="6" fill="#e6dfc0"/>
  <circle cx="697" cy="64" r="2.5" fill="#e6dfc0"/>

  <!-- cloud streaks -->
  <g fill="#f8c9a2" opacity="0.5">
