<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050617"/>
      <stop offset="0.45" stop-color="#10173d"/>
      <stop offset="0.8" stop-color="#2b1f58"/>
      <stop offset="1" stop-color="#4b2d5e"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3b2f66"/>
      <stop offset="0.3" stop-color="#1c2049"/>
      <stop offset="1" stop-color="#0b0d2a"/>
    </linearGradient>
    <radialGradient id="horizonGlow" cx="0.55" cy="1" r="0.7">
      <stop offset="0" stop-color="#ff9a4a" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#c4507e" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#4b2d5e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff6d6" stop-opacity="0.45"/>
      <stop offset="0.3" stop-color="#ffeec4" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffeec4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="lanternFill" cx="0.5" cy="0.8" r="0.75">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="0.4" stop-color="#ffc85e"/>
      <stop offset="1" stop-color="#ff7d2e"/>
    </radialGradient>
    <radialGradient id="lanternGlow">
      <stop offset="0" stop-color="#ffb347" stop-opacity="0.55"/>
      <stop offset="0.45" stop-color="#ff9a3a" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#ff8a2a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="reflGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbe5c" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#ffbe5c" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="burstMaskGrad">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.2" stop-color="#fff" stop-opacity="0.15"/>
      <stop offset="0.62" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="1"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.5"/>
    </radialGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="soft" x="-60%" y="-30%" width="220%" height="160%">
      <feGaussianBlur stdDeviation="2.5"/>
    </filter>
    <mask id="burstMask" maskUnits="userSpaceOnUse" x="-130" y="-130" width="260" height="260">
      <circle r="130" fill="url(#burstMaskGrad)"/>
    </mask>
    <g id="spark">
      <line x1="0" y1="-8" x2="0" y2="-78" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
      <circle cy="-80" r="2.4" fill="#fff"/>
      <g transform="rotate(15)">
        <line x1="0" y1="-8" x2="0" y2="-56" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <circle cy="-58" r="1.6" fill="#fffbe6"/>
      </g>
    </g>
    <g id="burst" mask="url(#burstMask)">
      <use xlink:href="#spark"/>
      <use xlink:href="#spark" transform="rotate(30)"/>
      <use xlink:href="#spark" transform="rotate(60)"/>
      <use xlink:href="#spark" transform="rotate(90)"/>
      <use xlink:href="#spark" transform="rotate(120)"/>
      <use xlink:href="#spark" transform="rotate(150)"/>
      <use xlink:href="#spark" transform="rotate(180)"/>
      <use xlink:href="#spark" transform="rotate(210)"/>
      <use xlink:href="#spark" transform="rotate(240)"/>
      <use xlink:href="#spark" transform="rotate(270)"/>
      <use xlink:href="#spark" transform="rotate(300)"/>
      <use xlink:href="#spark" transform="rotate(330)"/>
      <circle r="86" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="1.5 11" stroke-linecap="round" opacity="0.85"/>
      <circle r="96" fill="none" stroke="#fff" stroke-width="1.5" stroke-dasharray="1 17" stroke-linecap="round" opacity="0.55"/>
    </g>
    <g id="lantern">
      <circle r="40" fill="url(#lanternGlow)"/>
      <path d="M-8,18 L-12,-8 Q-12,-20 0,-20 Q12,-20 12,-8 L8,18 Z" fill="url(#lanternFill)"/>
      <path d="M-4,-19.4 L-3,18 M4,-19.4 L3,18" stroke="#e8822c" stroke-width="0.7" opacity="0.55" fill="none"/>
