<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <title>The Fall of Icarus</title>
  <desc>Icarus plunges, wings coming apart, across the face of a sinking sun while Daedalus flies on, a shepherd tends his flock on the cliffs, and a ship sails calmly toward the horizon.</desc>
  <defs>
    <linearGradient id="sky" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="520">
      <stop offset="0" stop-color="#12163a"/>
      <stop offset="0.3" stop-color="#3b2a5e"/>
      <stop offset="0.55" stop-color="#8c4256"/>
      <stop offset="0.75" stop-color="#cf6a42"/>
      <stop offset="0.9" stop-color="#ef9a4c"/>
      <stop offset="1" stop-color="#f7c472"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe9a8" stop-opacity="0.85"/>
      <stop offset="0.45" stop-color="#ffb963" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#ff8a3c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="sunDisc">
      <stop offset="0" stop-color="#fff9e0"/>
      <stop offset="0.55" stop-color="#ffe08a"/>
      <stop offset="0.9" stop-color="#ffbd5c"/>
      <stop offset="1" stop-color="#ff9d47"/>
    </radialGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4e7d93"/>
      <stop offset="0.25" stop-color="#2b5a74"/>
      <stop offset="1" stop-color="#091c30"/>
    </linearGradient>
    <linearGradient id="cliff" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2c2032"/>
      <stop offset="1" stop-color="#110b17"/>
    </linearGradient>
    <linearGradient id="reflect" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd27a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ffb060" stop-opacity="0"/>
    </linearGradient>
    <filter id="blur8" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="blur3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <g id="feather">
      <path d="M0 0 C4 -7 11 -11 18 -6 C12 -3 6 3 0 0 Z"/>
      <path d="M1 -0.5 L15 -6" stroke-width="0.6"/>
    </g>
    <path id="wave" d="M0 0 q25 -7 50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0 t50 0"/>
  </defs>

  <!-- sky -->
  <rect width="1200" height="800" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="80" cy="60" r="1.4" opacity="0.8"/>
    <circle cx="160" cy="110" r="1" opacity="0.6"/>
    <circle cx="230" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="330" cy="90" r="0.9" opacity="0.5"/>
    <circle cx="420" cy="30" r="1.5" opacity="0.85"/>
    <circle cx="500" cy="120" r="0.8" opacity="0.5"/>
    <circle cx="560" cy="60" r="1.1" opacity="0.6"/>
    <circle cx="660" cy="20" r="1.3" opacity="0.7"/>
    <circle cx="900" cy="25" r="1" opacity="0.6"/>
    <circle cx="1000" cy="40" r="1.2" opacity="0.7"/>
    <circle cx="1100" cy="90" r="0.9" opacity="0.5"/>
    <circle cx="1160" cy="30" r="1.4" opacity="0.8"/>
  </g>

  <!-- sun glow -->
  <circle cx="800" cy="390" r="330" fill="url(#sunGlow)"/>

  <!-- high dark clouds -->
  <g fill="#2a1d48" opacity="0.6">
    <path d="M120 150 C180 140 260 138 330 146 C400 152 440 160 470 158 C420 170 300 172 200 166 C160 164 130 160 120 150 Z"/>
    <path d="M900 130 C960 118 1050 120 1120 128 C1160 134 1190 138 1200 136 L1200 148 C1120 152 1000 150 940 144 C915 141 900 138 900 130 Z"/>
  </g>

  <!-- sun -->
  <circle cx="800" cy="390" r="135" fill="url(#sunDisc)"/>
  <circle cx="800" cy="390" r="135" fill="none" stroke="#fff3c4" stroke-opacity="0.7" stroke-width="4" filter="url(#blur3)"/>

  <!-- warm low clouds -->
  <path d="M640 296 C720 284 820 282 900 290 C940 294 960 300 980 300 C920 310 820 314 740 310 C690 306 660 302 640 296 Z" fill="#c9553a" opacity="0.55"/>
  <g fill="#ffb37d" opacity="0.75">
    <path d="M440 486 C520 474 640 472 740 480 C800 484 850 490 900 488 C840 502 700 506 600 502 C520 498 470 494 440 486 Z"/>
    <path d="M950 470 C1010 462 1090 460 1200 466 L1200 478 C1100 482 1010 480 950 470 Z"/>
  </g>

  <!-- far headlands -->
  <path d="M340 520 L372 496 L420 488 L468 506 L500 520 Z" fill="#6b3b5c" opacity="0.6"/>
  <path d="M1040 520 L1080 502 L1130 494 L1175 506 L1200 500 L1200 520 Z" fill="#7a4260" opacity="0.65"/>

  <!-- sea -->
  <rect x="0" y="520" width="1200" height="280" fill="url(#sea)"/>
  <rect x="0" y="519" width="1200" height="3" fill="#ffd9a0" opacity="0.45"/>

  <!-- sun reflection -->
  <path d="M740 520 L860 520 L930 790 L670 790 Z" fill="url(#reflect)" opacity="0.6" filter="url(#blur8)"/>
  <g fill="#ffd98a">
    <ellipse cx="800" cy="534" rx="70" ry="2.2" opacity="0.55"/>
    <ellipse cx="808" cy="547" rx="52" ry="2" opacity="0.5"/>
    <ellipse cx="794" cy="561" rx="78" ry="2.6" opacity="0.45"/>
    <ellipse cx="812" cy="577" rx="60" ry="2.4" opacity="0.4"/>
    <ellipse cx="790" cy="596" rx="90" ry="3" opacity="0.35"/>
    <ellipse cx="815" cy="618" rx="70" ry="3" opacity="0.3"/>
    <ellipse cx="796" cy="644" rx="100" ry="3.4" opacity="0.25"/>
    <ellipse cx="820" cy="674" rx="85" ry="3.6" opacity="0.2"/>
    <ellipse cx="800" cy="710" rx="120" ry="4" opacity="0.15"/>
    <ellipse cx="810" cy="750" rx="110" ry="4" opacity="0.1"/>
  </g>

  <!-- waves -->
  <g stroke="#a9d6e8" fill="none" stroke-width="1.4" stroke-linecap="round">
    <use xlink:href="#wave" href="#wave" transform="translate(0,548) scale(0.7,0.5)" opacity="0.18"/>
    <use xlink:href="#wave" href="#wave" transform="translate(-60,578) scale(0.85,0.7)" opacity="0.2"/>
    <use xlink:href="#wave" href="#wave" transform="translate(-150,616) scale(1.05,0.9)" opacity="0.22"/>
    <use xlink:href="#wave" href="#wave" transform="translate(-100,665) scale(1.25,1.1)" opacity="0.22"/>
    <use xlink:href="#wave" href="#wave" transform="translate(-240,722) scale(1.5,1.3)" opacity="0.2"/>
    <use xlink:href="#wave" href="#wave" transform="translate(-180,775) scale(1.7,1.5)" opacity="0.16"/>
  </g>

  <!-- cliffs -->
  <ellipse cx="170" cy="566" rx="210" ry="14" fill="#07131f" opacity="0.7" filter="url(#blur8)"/>
  <path d="M0 250 L30 240 L60 258 L95 236 L130 246 L160 262 L190 300 L215 318 L240 360 L265 395 L290 450 L318 505 L340 560 L0 560 Z" fill="url(#cliff)"/>
  <path d="M190 300 L215 318 L240 360 L265 395 L290 450 L318 505 L340 560" fill="none" stroke="#c4714a" stroke-width="2" opacity="0.55"/>
  <g stroke="#4a3550" stroke-width="1.2" opacity="0.5" fill="none">
    <path d="M60 300 L120 330 L170 380"/>
    <path d="M40 380 L110 420 L200 470"/>
    <path d="M150 262 L200 300"/>
    <path d="M90 470 L160 500 L240 540"/>
  </g>

  <!-- sheep and shepherd -->
  <g fill="#e8dcc4">
    <ellipse cx="78" cy="243" rx="5.5" ry="3.6"/>
    <circle cx="83" cy="241" r="1.8" fill="#2a1f2e"/>
    <ellipse cx="110" cy="237" rx="5.5" ry="3.6"/>
    <circle cx="104" cy="235" r="1.8" fill="#2a1f2e"/>
  </g>
  <g transform="translate(132,246)" stroke="#120c18" fill="#120c18" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="0" cy="-27" r="3.6" stroke="none"/>
    <path d="M0 -23 L0 -9 M0 -9 L-4 0 M0 -9 L4 0 M0 -18 L-6 -11 M0 -18 L7 -14" fill="none" stroke-width="2.6"/>
    <path d="M9 -15 L9 0" fill="none" stroke-width="1.6"/>
    <path d="M9 -15 q0 -6 5 -4" fill="none" stroke-width="1.6"/>
  </g>

  <!-- ship -->
  <g transform="translate(980,519)" fill="#1b1220">
    <path d="M-34 -4 Q-37 -10 -30 -12 L30 -12 Q39 -12 37 -4 L31 2 L-28 2 Z"/>
    <rect x="-3" y="-54" width="2.4" height="42"/>
    <path d="M-0.6 -52 L-0.6 -16 L26 -16 Z"/>
    <path d="M-3 -46 L-3 -18 L-22 -18 Z"/>
  </g>

  <!-- gulls -->
  <g fill="none" stroke="#1a1020" stroke-width="1.6" stroke-linecap="round">
    <path d="M392 340 q7 -7 14 0 q7 -7 14 0"/>
    <path d="M440 362 q6 -6 12 0 q6 -6 12 0"/>
    <path d="M372 310 q5 -5 10 0 q5 -5 10 0"/>
  </g>

  <!-- Daedalus, flying on -->
  <g transform="translate(300,205) rotate(-15) scale(0.34)">
    <g fill="#c9a66a" stroke="#2a1a14" stroke-width="2.5" stroke-linejoin="round">
      <path d="M-6 -10 C-40 -40 -90 -52 -150 -36 C-125 -26 -118 -16 -128 -2 C-106 -6 -94 2 -98 16 C-80 10 -62 12 -50 22 C-36 14 -22 10 -8 8 Z"/>
      <path d="M6 -10 C40 -40 90 -52 150 -36 C125 -26 118 -16 128 -2 C106 -6 94 2 98 16 C80 10 62 12 50 22 C36 14 22 10 8 8 Z"/>
    </g>
    <g fill="#1e1430" stroke="#1e1430" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-30" r="12" stroke="none"/>
      <path d="M-12 -18 Q0 -22 12 -18 L9 20 Q0 24 -9 20 Z" stroke-width="2"/>
      <path d="M-10 -14 L-30 -28 L-40 -46" fill="none" stroke-width="9"/>
      <path d="M10 -14 L30 -28 L40 -46" fill="none" stroke-width="9"/>
      <path d="M-5 20 L-8 48 L-4 70" fill="none" stroke-width="10"/>
      <path d="M5 20 L10 48 L6 70" fill="none" stroke-width="10"/>
    </g>
  </g>

  <!-- loose feathers -->
  <g fill="#ebd49a" stroke="#3a2418" stroke-width="0.8" opacity="0.95">
    <use xlink:href="#feather" href="#feather" transform="translate(812,230) rotate(-40) scale(0.9)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(770,222) rotate(25)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(740,250) rotate(-80) scale(1.1)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(720,236) rotate(150) scale(0.8)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(690,262) rotate(-70) scale(0.9)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(668,300) rotate(20)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(700,330) rotate(-30) scale(1.2)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(735,300) rotate(100) scale(0.8)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(640,268) rotate(140) scale(1.1)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(620,225) rotate(-10) scale(0.8)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(585,250) rotate(60)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(560,205) rotate(-120) scale(0.9)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(600,330) rotate(-45) scale(0.7)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(676,452) rotate(-150) scale(1.3)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(700,500) rotate(40) scale(1.1)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(660,440) rotate(170) scale(0.9)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(745,545) rotate(10)"/>
    <use xlink:href="#feather" href="#feather" transform="translate(655,538) rotate(-25) scale(0.8)"/>
  </g>

  <!-- torn wing fragment -->
  <g transform="translate(700,470) rotate(-60) scale(0.9)" fill="#d9b06a" stroke="#3a2418" stroke-width="1.4" stroke-linejoin="round">
    <path d="M0 0 C10 -18 30 -28 50 -22 C40 -14 42 -6 34 -2 C28 6 16 6 8 4 Z"/>
    <path d="M4 0 C18 -14 34 -20 46 -20" fill="none" stroke-width="0.9" opacity="0.6"/>
  </g>

  <!-- Icarus -->
  <g transform="translate(770,395) rotate(150)">
    <g fill="#d9b06a" stroke="#3a2418" stroke-width="1.6" stroke-linejoin="round">
      <path d="M-10 -58 C-45 -95 -100 -105 -160 -85 C-135 -72 -128 -62 -140 -50 C-118 -52 -106 -44 -112 -30 C-95 -34 -78 -28 -70 -16 C-55 -22 -38 -26 -12 -32 Z"/>
      <path d="M10 -58 C35 -78 62 -88 92 -84 C80 -74 86 -64 74 -58 C70 -48 56 -46 46 -44 C40 -36 26 -36 12 -32 Z"/>
    </g>
    <g fill="none" stroke="#3a2418" stroke-width="1" opacity="0.55">
      <path d="M-14 -50 C-60 -78 -110 -90 -150 -82"/>
      <path d="M-14 -44 C-55 -62 -95 -64 -132 -52"/>
      <path d="M-14 -39 C-50 -48 -85 -44 -108 -34"/>
      <path d="M-14 -34 C-45 -36 -65 -30 -72 -19"/>
      <path d="M14 -50 C40 -72 65 -82 86 -80"/>
      <path d="M14 -44 C35 -58 55 -62 70 -58"/>
      <path d="M14 -38 C30 -44 42 -44 48 -43"/>
    </g>
    <g fill="#f6e4a0" stroke="#3a2418" stroke-width="0.8">
      <path d="M26 -52 c-3 -6 -1 -9 2 -9 s4 4 -2 9z"/>
      <path d="M42 -60 c-2 -5 -1 -8 2 -8 s3 4 -2 8z"/>
    </g>
    <g fill="#1a1020" stroke="#1a1020" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="0" cy="-72" r="11" stroke="none"/>
      <path d="M-12 -60 Q0 -66 12 -60 L10 -14 Q0 -8 -10 -14 Z" stroke-width="2"/>
      <path d="M-11 -56 L-36 -74 L-52 -98" fill="none" stroke-width="9"/>
      <path d="M11 -56 L34 -66 L56 -58" fill="none" stroke-width="9"/>
      <path d="M-6 -14 L-16 24 L-10 58" fill="none" stroke-width="10"/>
      <path d="M6 -14 L24 16 L42 36" fill="none" stroke-width="10"/>
    </g>
  </g>

  <!-- foreground rock -->
  <path d="M0 640 C50 615 110 618 150 645 C180 665 190 700 170 735 C150 765 100 785 0 790 Z" fill="#070510"/>
  <path d="M0 636 C52 610 114 613 155 641 C188 663 198 700 177 737" fill="none" stroke="#d7ecf4" stroke-width="2" opacity="0.3"/>

  <!-- caption -->
  <g font-family="Georgia, 'Times New Roman', serif" fill="#f3e2b8">
    <text x="40" y="746" font-size="26" font-style="italic" opacity="0.92">The Fall of Icarus</text>
    <text x="41" y="770" font-size="12" letter-spacing="2.5" opacity="0.6">AFTER OVID, METAMORPHOSES VIII</text>
  </g>
</svg>