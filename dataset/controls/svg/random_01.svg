    <circle cx="300" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="350" cy="90" r="1" opacity="0.6"/>
    <circle cx="420" cy="25" r="1.3" opacity="0.8"/>
    <circle cx="470" cy="110" r="1" opacity="0.7"/>
    <circle cx="520" cy="60" r="1.6" opacity="0.9"/>
    <circle cx="580" cy="140" r="0.9" opacity="0.5"/>
    <circle cx="610" cy="30" r="1.2" opacity="0.8"/>
    <circle cx="660" cy="90" r="1" opacity="0.7"/>
    <circle cx="700" cy="170" r="0.8" opacity="0.5"/>
    <circle cx="740" cy="50" r="1.4" opacity="0.9"/>
    <circle cx="790" cy="120" r="1" opacity="0.6"/>
    <circle cx="830" cy="20" r="1.3" opacity="0.8"/>
    <circle cx="870" cy="80" r="1" opacity="0.7"/>
    <circle cx="900" cy="180" r="0.9" opacity="0.5"/>
    <circle cx="940" cy="40" r="1.5" opacity="0.9"/>
    <circle cx="980" cy="130" r="1" opacity="0.7"/>
    <circle cx="1020" cy="70" r="1.2" opacity="0.8"/>
    <circle cx="1060" cy="20" r="1" opacity="0.7"/>
    <circle cx="1090" cy="150" r="0.9" opacity="0.5"/>
    <circle cx="1130" cy="90" r="1.4" opacity="0.9"/>
    <circle cx="1170" cy="40" r="1.1" opacity="0.7"/>
    <circle cx="1185" cy="200" r="0.9" opacity="0.5"/>
    <circle cx="380" cy="170" r="1" opacity="0.6"/>
    <circle cx="450" cy="210" r="0.8" opacity="0.5"/>
    <circle cx="560" cy="230" r="0.9" opacity="0.5"/>
