    <circle cx="790" cy="372" r="36" fill="#fff3c4"/>
    <path d="M0 520 L0 400 L80 360 L160 390 L240 310 L320 370 L400 330 L470 380 L560 300 L640 350 L700 318 L745 372 L790 384 L835 366 L880 300 L960 350 L1040 330 L1120 380 L1200 340 L1200 520 Z" fill="url(#farGrad)"/>
    <g fill="#f6dde3" opacity="0.85">
