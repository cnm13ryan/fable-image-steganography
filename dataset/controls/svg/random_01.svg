  <circle cx="1103" cy="635" r="24" fill="url(#windowGlow)" opacity="0.7"/>
  <rect x="1096" y="628" width="14" height="14" rx="1" fill="#ffc96d"/>
  <path d="M1096 635 h14 M1103 628 v14" stroke="#0a0814" stroke-width="1.2" fill="none"/>
  <path d="M1126 590 C1122 578 1134 570 1128 558 C1122 546 1134 538 1130 526" fill="none" stroke="#d9c9e2" stroke-opacity="0.35" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Fireflies -->
  <g fill="#d9ff8c" opacity="0.5" filter="url(#softGlow)">
    <circle cx="140" cy="690" r="4"/>
    <circle cx="190" cy="712" r="3"/>
    <circle cx="260" cy="680" r="3.5"/>
    <circle cx="330" cy="722" r="3"/>
    <circle cx="960" cy="700" r="3.5"/>
    <circle cx="1020" cy="730" r="3"/>
    <circle cx="1130" cy="690" r="4"/>
  </g>
  <g fill="#e6ffa8">
    <circle cx="140" cy="690" r="1.8" opacity="0.9"/>
    <circle cx="190" cy="712" r="1.3" opacity="0.7"/>
    <circle cx="260" cy="680" r="1.6" opacity="0.8"/>
    <circle cx="330" cy="722" r="1.2" opacity="0.6"/>
    <circle cx="960" cy="700" r="1.6" opacity="0.8"/>
    <circle cx="1020" cy="730" r="1.2" opacity="0.6"/>
