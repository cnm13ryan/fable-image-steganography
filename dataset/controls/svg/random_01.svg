    <path d="M0 800 L0 662 C90 648 170 672 270 688 C370 704 440 738 540 744 C640 750 710 722 810 714 C910 706 990 672 1080 648 C1130 634 1165 628 1200 624 L1200 800 Z"/>
    <use xlink:href="#pine" transform="translate(45 668) scale(1.15)"/>
    <use xlink:href="#pine" transform="translate(105 672) scale(0.9)"/>
    <use xlink:href="#pine" transform="translate(165 680) scale(1.3)"/>
    <use xlink:href="#pine" transform="translate(225 690) scale(0.85)"/>
    <use xlink:href="#pine" transform="translate(285 700) scale(1)"/>
    <use xlink:href="#pine" transform="translate(350 712) scale(0.7)"/>
    <use xlink:href="#pine" transform="translate(1185 636) scale(1.15)"/>
    <use xlink:href="#pine" transform="translate(1010 672) scale(1.05)"/>
    <use xlink:href="#pine" transform="translate(955 688) scale(0.8)"/>
    <use xlink:href="#pine" transform="translate(895 708) scale(0.6)"/>
    <rect x="1075" y="615" width="60" height="40"/>
