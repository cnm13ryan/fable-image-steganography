    <line x1="738" y1="548" x2="842" y2="548" stroke-width="2" stroke-opacity="0.55"/>
    <line x1="755" y1="562" x2="825" y2="562" stroke-width="1.5" stroke-opacity="0.45"/>
    <line x1="728" y1="580" x2="852" y2="580" stroke-width="2" stroke-opacity="0.4"/>
    <line x1="770" y1="598" x2="810" y2="598" stroke-width="1.5" stroke-opacity="0.5"/>
    <line x1="712" y1="620" x2="868" y2="620" stroke-width="2" stroke-opacity="0.3"/>
    <line x1="748" y1="645" x2="832" y2="645" stroke-width="1.5" stroke-opacity="0.35"/>
    <line x1="722" y1="672" x2="858" y2="672" stroke-width="2" stroke-opacity="0.25"/>
    <line x1="762" y1="700" x2="818" y2="700" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="120" y1="585" x2="210" y2="585" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="300" y1="605" x2="380" y2="605" stroke-width="1.5" stroke-opacity="0.18"/>
    <line x1="520" y1="570" x2="640" y2="570" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="950" y1="590" x2="1060" y2="590" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="600" y1="655" x2="680" y2="655" stroke-width="1.5" stroke-opacity="0.15"/>
    <line x1="180" y1="630" x2="250" y2="630" stroke-width="1.5" stroke-opacity="0.15"/>
    <line x1="1000" y1="625" x2="1120" y2="625" stroke-width="1.5" stroke-opacity="0.15"/>
    <line x1="60" y1="560" x2="150" y2="560" stroke-width="1.5" stroke-opacity="0.2"/>
    <line x1="420" y1="548" x2="560" y2="548" stroke-width="1.5" stroke-opacity="0.22"/>
    <line x1="880" y1="556" x2="1000" y2="556" stroke-width="1.5" stroke-opacity="0.2"/>
  </g>
  <line x1="0" y1="520" x2="1200" y2="520" stroke="#ffe0b8" stroke-opacity="0.35" stroke-width="1"/>

  <!-- Mist -->
  <g fill="#ffd8c2" filter="url(#blur12)">
    <ellipse cx="260" cy="524" rx="280" ry="11" opacity="0.28"/>
    <ellipse cx="820" cy="528" rx="320" ry="13" opacity="0.24"/>
    <ellipse cx="560" cy="538" rx="200" ry="9" opacity="0.16"/>
