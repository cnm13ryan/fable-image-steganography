<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060a1e"/>
      <stop offset="0.3" stop-color="#1e1740"/>
      <stop offset="0.5" stop-color="#4a2560"/>
      <stop offset="0.65" stop-color="#8a3a6a"/>
      <stop offset="0.78" stop-color="#d2607a"/>
      <stop offset="0.9" stop-color="#f59a6a"/>
      <stop offset="1" stop-color="#ffd38f"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e8946c"/>
      <stop offset="0.12" stop-color="#9c4c6c"/>
      <stop offset="0.4" stop-color="#36204f"/>
      <stop offset="1" stop-color="#0b091a"/>
    </linearGradient>
    <radialGradient id="sunGlow">
      <stop offset="0" stop-color="#ffe9b0" stop-opacity="0.95"/>
      <stop offset="0.25" stop-color="#ffb46a" stop-opacity="0.6"/>
      <stop offset="0.6" stop-color="#ff7d63" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#ff6a6a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="moonGlow">
      <stop offset="0" stop-color="#fff6dc" stop-opacity="0.4"/>
      <stop offset="0.45" stop-color="#fff6dc" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#fff6dc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="windowGlow">
      <stop offset="0" stop-color="#ffc86b" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffc86b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vignette" cx="0.5" cy="0.5" r="0.72">
      <stop offset="0.55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity="0.45"/>
    </radialGradient>
    <linearGradient id="farGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6d4479"/>
      <stop offset="1" stop-color="#9a6690"/>
    </linearGradient>
    <linearGradient id="midGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#452a5c"/>
      <stop offset="1" stop-color="#5c3b6e"/>
    </linearGradient>
    <linearGradient id="nearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a40"/>
      <stop offset="1" stop-color="#36234c"/>
    </linearGradient>
    <linearGradient id="streak" gradientUnits="userSpaceOnUse" x1="880" y1="50" x2="990" y2="118">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.9"/>
    </linearGradient>
    <filter id="blur12" x="-20%" y="-200%" width="140%" height="500%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="blur30" x="-30%" y="-100%" width="160%" height="300%">
      <feGaussianBlur stdDeviation="30"/>
    </filter>
    <filter id="shimmer" x="-100%" y="-50%" width="300%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="reflBlur" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="1.2 3"/>
    </filter>
    <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>
    <mask id="moonMask">
      <rect x="100" y="20" width="220" height="220" fill="#000"/>
      <circle cx="210" cy="130" r="58" fill="#fff"/>
      <circle cx="192" cy="121" r="56" fill="#000"/>
    </mask>
    <clipPath id="waterClip">
      <rect x="0" y="520" width="1200" height="280"/>
    </clipPath>
    <path id="pine" d="M0 -150 L16 -116 L8 -116 L24 -84 L12 -84 L32 -50 L16 -50 L40 -10 L7 -10 L7 0 L-7 0 L-7 -10 L-40 -10 L-16 -50 L-32 -50 L-12 -84 L-24 -84 L-8 -116 L-16 -116 Z"/>
