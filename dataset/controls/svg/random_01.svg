    <circle cx="760" cy="220" r="1" opacity="0.5"/>
    <circle cx="850" cy="250" r="0.8" opacity="0.4"/>
    <circle cx="1000" cy="240" r="0.9" opacity="0.5"/>
    <circle cx="1120" cy="260" r="0.8" opacity="0.4"/>
    <circle cx="60" cy="260" r="1" opacity="0.6"/>
    <circle cx="120" cy="300" r="0.8" opacity="0.4"/>
    <circle cx="20" cy="150" r="1.1" opacity="0.7"/>
    <circle cx="340" cy="250" r="0.9" opacity="0.5"/>
    <circle cx="270" cy="290" r="0.8" opacity="0.4"/>
