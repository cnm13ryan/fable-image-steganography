      <path d="M389 341 L400 330 L411 339 L405 337 L400 344 L394 337 Z"/>
      <path d="M542 318 L560 300 L578 314 L570 310 L560 322 L551 312 Z"/>
      <path d="M862 318 L880 300 L898 313 L890 309 L880 322 L871 311 Z"/>
    </g>
    <path d="M0 520 L0 440 L60 420 L130 450 L200 410 L280 460 L350 420 L430 470 L520 410 L600 450 L680 420 L760 470 L840 430 L920 465 L1000 420 L1080 460 L1150 430 L1200 455 L1200 520 Z" fill="url(#midGrad)"/>
