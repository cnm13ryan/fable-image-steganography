<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#B9506E"/>
      <stop offset="0.35" stop-color="#EF7F57"/>
      <stop offset="0.7" stop-color="#FCB76A"/>
      <stop offset="1" stop-color="#FFE9AE"/>
    </linearGradient>
    <radialGradient id="glow" cx="710" cy="248" r="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFF4C4" stop-opacity="0.95"/>
      <stop offset="0.5" stop-color="#FFD57E" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#FFC06A" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2DA4AE"/>
      <stop offset="1" stop-color="#17727F"/>
    </linearGradient>
    <linearGradient id="cream" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FAF4E4"/>
      <stop offset="1" stop-color="#EFE5CB"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#D6EEF2"/>
      <stop offset="1" stop-color="#78B3C9"/>
    </linearGradient>
    <linearGradient id="chromeBar" x1="0" y1="346" x2="0" y2="358" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.55" stop-color="#C4C4C4"/>
      <stop offset="1" stop-color="#7F7F7F"/>
    </linearGradient>
    <radialGradient id="hub" cx="0.4" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.6" stop-color="#CFCFCF"/>
      <stop offset="1" stop-color="#8A8A8A"/>
    </radialGradient>

    <path id="body" d="M186 372 L172 372 Q160 372 157 360 C152 338 150 295 151 250 C152 212 170 185 232 185 L586 185 C626 185 650 206 650 246 L650 362 Q650 372 640 372 L558 372 A46 46 0 0 0 466 372 L278 372 A46 46 0 0 0 186 372 Z"/>
    <clipPath id="bodyClip"><use href="#body" xlink:href="#body"/></clipPath>

    <path id="w1" d="M216 231 Q216 207 240 207 H310 Q314 207 314 211 V253 Q314 257 310 257 H220 Q216 257 216 253 Z"/>
    <rect id="w2" x="334" y="207" width="50" height="50" rx="4"/>
    <rect id="w3" x="402" y="207" width="50" height="50" rx="4"/>
    <rect id="w4" x="474" y="207" width="74" height="50" rx="4"/>
    <path id="w5" d="M562 211 Q562 207 566 207 H596 Q620 207 620 231 V253 Q620 257 616 257 H566 Q562 257 562 253 Z"/>
    <g id="wins">
      <use href="#w1" xlink:href="#w1"/>
      <use href="#w2" xlink:href="#w2"/>
      <use href="#w3" xlink:href="#w3"/>
      <use href="#w4" xlink:href="#w4"/>
      <use href="#w5" xlink:href="#w5"/>
    </g>
    <clipPath id="winClip">
      <use href="#w1" xlink:href="#w1"/>
      <use href="#w2" xlink:href="#w2"/>
      <use href="#w3" xlink:href="#w3"/>
      <use href="#w4" xlink:href="#w4"/>
      <use href="#w5" xlink:href="#w5"/>
    </clipPath>

    <g id="wheel">
      <circle r="38" fill="#262626"/>
      <circle r="31" fill="none" stroke="#3A3A3A" stroke-width="2"/>
      <circle r="25" fill="#EFE8D5" stroke="#27353B" stroke-width="1.5"/>
      <circle r="13" fill="url(#hub)" stroke="#9A9A9A" stroke-width="0.8"/>
      <circle r="3.2" fill="#7A7A7A"/>
    </g>
  </defs>

  <!-- Sky and sun -->
  <rect width="800" height="360" fill="url(#sky)"/>
  <circle cx="710" cy="248" r="120" fill="url(#glow)"/>
  <circle cx="710" cy="248" r="58" fill="#FFF3BE"/>

  <!-- Clouds -->
  <g fill="#FFF0D8" opacity="0.9">
    <ellipse cx="130" cy="96" rx="34" ry="16"/>
    <ellipse cx="160" cy="86" rx="38" ry="22"/>
    <ellipse cx="195" cy="96" rx="30" ry="15"/>
    <ellipse cx="610" cy="72" rx="28" ry="13"/>
    <ellipse cx="636" cy="64" rx="32" ry="18"/>
    <ellipse cx="664" cy="74" rx="24" ry="12"/>
  </g>

  <!-- Birds -->
  <path d="M262 128 q7 -7 14 0 q7 -7 14 0 M300 112 q5 -5 10 0 q5 -5 10 0" fill="none" stroke="#6B3A4A" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Hills -->
  <path d="M0 296 C60 280 110 268 170 274 C230 280 270 300 340 292 C410 284 450 262 520 266 C590 270 630 290 700 278 C750 270 780 262 800 266 L800 340 L0 340 Z" fill="#D29BAB"/>
  <path d="M0 334 C80 318 140 306 220 312 C300 318 350 336 430 328 C510 320 560 300 640 306 C720 312 760 330 800 324 L800 360 L0 360 Z" fill="#A86E8E"/>

  <!-- Ground and bushes -->
  <rect y="352" width="800" height="52" fill="#DDBE7E"/>
  <g fill="#8E8A4F">
    <circle cx="40" cy="400" r="7"/>
    <circle cx="70" cy="398" r="10"/>
    <circle cx="84" cy="396" r="13"/>
    <circle cx="98" cy="399" r="9"/>
    <circle cx="720" cy="398" r="9"/>
    <circle cx="736" cy="395" r="12"/>
    <circle cx="750" cy="398" r="8"/>
  </g>

  <!-- Road -->
  <rect y="400" width="800" height="100" fill="#4B485A"/>
  <rect y="400" width="800" height="5" fill="#7A7686"/>
  <line x1="0" y1="460" x2="800" y2="460" stroke="#EFE3B6" stroke-width="4" stroke-dasharray="42 30"/>
  <ellipse cx="400" cy="414" rx="262" ry="8" fill="#000" opacity="0.28"/>

  <!-- Camper van -->
  <g>
    <!-- roof rack and surfboard -->
    <rect x="296" y="170" width="6" height="17" rx="1" fill="#B9B9B9" stroke="#27353B" stroke-width="1"/>
    <rect x="536" y="170" width="6" height="17" rx="1" fill="#B9B9B9" stroke="#27353B" stroke-width="1"/>
    <rect x="282" y="167" width="274" height="5" rx="2.5" fill="#CFCFCF" stroke="#27353B" stroke-width="1"/>
    <path d="M554 158 C559 146 569 139 580 136 L575 158 Z" fill="#27353B"/>
    <path d="M236 160 C300 149 540 149 608 160 C540 171 300 171 236 160 Z" fill="#F7F7F2" stroke="#27353B" stroke-width="1.5"/>
    <path d="M262 160 C320 155.5 520 155.5 582 160 C520 164.5 320 164.5 262 160 Z" fill="#2DA4AE"/>
    <path d="M299 152 V171 M539 152 V171" stroke="#2B2B2B" stroke-width="2.5" stroke-linecap="round" opacity="0.85"/>

    <!-- wheel wells -->
    <path d="M186 372 A46 46 0 0 1 278 372 Z M466 372 A46 46 0 0 1 558 372 Z" fill="#0E2E36"/>

    <!-- body -->
    <use href="#body" xlink:href="#body" fill="url(#cream)"/>
    <g clip-path="url(#bodyClip)">
      <rect x="140" y="140" width="520" height="60" fill="#FFFBF0"/>
      <line x1="140" y1="200" x2="660" y2="200" stroke="#27353B" stroke-opacity="0.35" stroke-width="1.5"/>
      <rect x="140" y="262" width="520" height="120" fill="url(#teal)"/>
      <rect x="140" y="366" width="520" height="6" fill="#0E2E36" opacity="0.45"/>
      <path d="M208 200 V366 M325 200 V366 M393 200 V366 M462 200 V366" stroke="#000" stroke-opacity="0.22" stroke-width="1.5"/>
      <rect x="140" y="260.5" width="520" height="3" fill="#E6E6E6" stroke="#27353B" stroke-width="0.8"/>
    </g>

    <!-- windows -->
    <use href="#wins" xlink:href="#wins" fill="url(#glass)"/>
    <g clip-path="url(#winClip)" fill="none" stroke="#FFFFFF" stroke-opacity="0.28">
      <path d="M226 262 L282 198 M316 262 L372 198 M406 262 L462 198 M496 262 L552 198 M586 262 L642 198" stroke-width="14"/>
      <path d="M252 262 L308 198 M342 262 L398 198 M432 262 L488 198 M522 262 L578 198 M612 262 L668 198" stroke-width="5"/>
    </g>
    <use href="#wins" xlink:href="#wins" fill="none" stroke="#27353B" stroke-width="2"/>
    <g fill="url(#glass)" stroke="#27353B" stroke-width="1.2">
      <ellipse cx="352" cy="192.5" rx="10" ry="4.5"/>
      <ellipse cx="400" cy="192.5" rx="10" ry="4.5"/>
      <ellipse cx="448" cy="192.5" rx="10" ry="4.5"/>
      <ellipse cx="496" cy="192.5" rx="10" ry="4.5"/>
    </g>

    <!-- door handles -->
    <g fill="#E6E6E6" stroke="#27353B" stroke-width="0.8">
      <rect x="296" y="279" width="18" height="6" rx="3"/>
      <rect x="370" y="279" width="16" height="6" rx="3"/>
      <rect x="400" y="279" width="16" height="6" rx="3"/>
    </g>

    <!-- body outline -->
    <use href="#body" xlink:href="#body" fill="none" stroke="#27353B" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- lights and bumpers -->
    <ellipse cx="152" cy="262" rx="4.5" ry="7" fill="#FFB13B" stroke="#27353B" stroke-width="1.2"/>
    <ellipse cx="152" cy="288" rx="6" ry="10" fill="#FFF3C4" stroke="#27353B" stroke-width="1.2"/>
    <ellipse cx="151" cy="285" rx="2.4" ry="4" fill="#FFFFFF" opacity="0.8"/>
    <rect x="646" y="288" width="9" height="20" rx="3" fill="#E0313F" stroke="#27353B" stroke-width="1.2"/>
    <path d="M142 352 H180 M620 352 H658" fill="none" stroke="#27353B" stroke-width="13" stroke-linecap="round"/>
    <path d="M142 352 H180 M620 352 H658" fill="none" stroke="url(#chromeBar)" stroke-width="11" stroke-linecap="round"/>

    <!-- wheels -->
    <use href="#wheel" xlink:href="#wheel" x="232" y="374"/>
    <use href="#wheel" xlink:href="#wheel" x="512" y="374"/>
  </g>
</svg>