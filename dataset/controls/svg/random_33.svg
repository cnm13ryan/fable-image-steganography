  <ellipse cx="552" cy="195" rx="6" ry="2.5" fill="#5f9f5a" transform="rotate(-35 552 195)"/>
  <ellipse cx="536" cy="197" rx="5.5" ry="2.3" fill="#5f9f5a" transform="rotate(30 536 197)"/>
