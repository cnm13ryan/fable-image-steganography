  <path d="M250 353L365 352A26 26 0 1 1 357.7 403L247.5 370.6A9 9 0 0 1 250 353Z" fill="none" stroke="#a0a0a0" stroke-width="1" stroke-dasharray="3 2.5"/>
  <path d="M365 378L401 408" fill="none" stroke="#3d3d3d" stroke-width="5" stroke-linecap="round"/>
  <circle cx="365" cy="378" r="4" fill="#222"/>
  <rect x="392" y="405" width="20" height="6" rx="2" fill="#262626"/>

