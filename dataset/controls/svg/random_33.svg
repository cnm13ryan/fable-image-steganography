  <ellipse cx="392" cy="457" rx="250" ry="5" fill="#000" opacity="0.14"/>
  <ellipse cx="250" cy="457" rx="30" ry="3.5" fill="#000" opacity="0.28"/>
  <ellipse cx="530" cy="457" rx="30" ry="3.5" fill="#000" opacity="0.28"/>

