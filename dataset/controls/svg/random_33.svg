  <path d="M272 208C273 198 292 195 306 197C322 199 338 202 348 207C344 213 328 214 312 214C294 214 276 213 272 208Z" fill="#5a3a22" stroke="#3a2616" stroke-width="1"/>
  <path d="M279 204C292 200 318 201 340 206" fill="none" stroke="#916038" stroke-width="1.5" stroke-linecap="round"/>

