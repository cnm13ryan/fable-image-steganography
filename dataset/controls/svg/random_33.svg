      <path d="M0-81V81M27.7-76.1L-27.7 76.1M52.1-62L-52.1 62M70.1-40.5L-70.1 40.5M79.8-14.1L-79.8 14.1M79.8 14.1L-79.8-14.1M70.1 40.5L-70.1-40.5M52.1 62L-52.1-62M27.7 76.1L-27.7-76.1" fill="none" stroke="#c3c8cd" stroke-width="1.4"/>
