      <circle cx="-11" cy="-27" r="12" fill="#57984f"/>
      <circle cx="11" cy="-27" r="12" fill="#57984f"/>
      <circle cy="-38" r="17" fill="#57984f"/>
      <circle cx="-4" cy="-42" r="8" fill="#72b267" opacity="0.7"/>
    </g>
    <g id="wheel">
      <circle r="91" fill="none" stroke="#2b2b2b" stroke-width="8"/>
      <circle r="87.5" fill="none" stroke="#c9a97b" stroke-width="2.4"/>
      <circle r="83.5" fill="none" stroke="#dfe3e6" stroke-width="5"/>
      <circle r="86" fill="none" stroke="#8f959b" stroke-width="0.7"/>
