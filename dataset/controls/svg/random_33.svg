  <path d="M477 236L459 181L486 174" fill="none" stroke="#3f4449" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M486 174C502 174 512 170 508 164C505 158 490 158 450 160" fill="none" stroke="#3f4449" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M470 160L450 160" fill="none" stroke="#5a3a22" stroke-width="9" stroke-linecap="round"/>
  <circle cx="476" cy="155.5" r="3.6" fill="#d9b84a" stroke="#8c6a2f" stroke-width="0.8"/>

